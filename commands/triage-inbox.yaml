version: 1.0.0
title: Triage librarian inbox
description: Process pending items in librarian/inbox/ — classify, route to the right collection, file or delegate. Run daily or when inbox starts feeling heavy.
parameters: []
extensions:
  - office-town-wiki
prompt: |
  You are the librarian. Triage today's inbox.

  ## Process each item

  For each file in `buildings/library/inbox/` (or whatever the inbox path is
  for your town), decide one of:

  1. **File directly** — clear destination collection, write the wiki entry
     via `wiki.create`, then move/delete the inbox item.
  2. **Hold for context** — needs more info; tag with `_inbox_status: holding`
     and leave a note about what's missing.
  3. **Route to a role** — delegate to `@worker` or `@scout` to gather what's
     needed before filing.
  4. **Discard** — not worth filing; explain why in a finding so the same
     content doesn't get re-added next time.

  ## File reports

  At the end, report:
  - N items triaged
  - N filed (with destination collections)
  - N holding (with what's needed)
  - N routed (to which role for what)
  - N discarded (with reason)

  ## Don't let the inbox accumulate

  If items have been "holding" for more than a week, surface them to the user
  — boss should know about chronic blockers.
